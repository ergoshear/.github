<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 -6 1032 1151.0" width="1032" height="1151.0" role="img" aria-labelledby="title description"><title id="title">ergoshear infrastructure and deployment architecture</title><desc id="description">Three repositories manage AWS infrastructure, Salt configuration, and k3s. Route 53, ExternalDNS, cert-manager, and Traefik provide HTTPS to Argo CD.</desc><rect x="4" y="-6" width="1032" height="1151.0" fill="#ffffff" /><defs><marker id="arrow-infra-deploy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#1d4ed8" /></marker><marker id="arrow-salt-instance" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#1d4ed8" /></marker><marker id="arrow-k3s-instance" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#1d4ed8" /></marker><marker id="arrow-highstate" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#047857" /></marker><marker id="arrow-token" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#047857" /></marker><marker id="arrow-tls-api" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#b45309" /></marker><marker id="arrow-dns-link" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#b45309" /></marker></defs><text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="32"><tspan x="24" y="46.0">Small cluster. Everything connected.</tspan></text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="17"><tspan x="24" y="81.0">ergoshear / AWS + Salt + k3s / October 2026</tspan></text><rect x="24" y="110" width="312" height="164" fill="#eff6ff" stroke="#eff6ff" stroke-width="1.5" rx="16" /><text fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="23"><tspan x="44" y="149.0">01 / aws</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16"><tspan x="44" y="182.0">Terraform + Terragrunt</tspan><tspan x="44" y="204.4">PR: plan / main: apply</tspan><tspan x="44" y="226.8">GitHub OIDC + S3 state</tspan></text><rect x="364" y="110" width="312" height="164" fill="#ecfdf5" stroke="#ecfdf5" stroke-width="1.5" rx="16" /><text fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="23"><tspan x="384" y="149.0">02 / salt</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16"><tspan x="384" y="182.0">Local highstate: test, then apply</tspan><tspan x="384" y="204.4">Runner: salt-master-01</tspan><tspan x="384" y="226.8">Checkout serves states + pillar</tspan></text><rect x="704" y="110" width="312" height="164" fill="#f5f3ff" stroke="#f5f3ff" stroke-width="1.5" rx="16" /><text fill="#7c3aed" font-family="Arial, Helvetica, sans-serif" font-size="23"><tspan x="724" y="149.0">03 / k3s</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16"><tspan x="724" y="182.0">main: server-side Kustomize apply</tspan><tspan x="724" y="204.4">Runner: k3s-control-plane-01</tspan><tspan x="724" y="226.8">Argo CD + platform services</tspan></text><polyline points="180,274 180,324" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-infra-deploy)" /><text fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="14"><tspan x="198" y="297.0">provision</tspan></text><rect x="24" y="324" width="992" height="112" fill="#eff6ff" stroke="#eff6ff" stroke-width="1.5" rx="16" /><text fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="23"><tspan x="44" y="363.0">AWS / us-east-2</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16"><tspan x="44" y="396.0">VPC + public subnet / 2 EC2 hosts / persistent Elastic IPs / security groups / SSM</tspan></text><polyline points="240,436 240,484" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-salt-instance)" /><polyline points="800,436 800,484" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-k3s-instance)" /><rect x="24" y="484" width="432" height="270" fill="#ecfdf5" stroke="#ecfdf5" stroke-width="1.5" rx="16" /><text fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="23"><tspan x="44" y="523.0">salt.ergoshear.dev</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16"><tspan x="44" y="556.0">salt-master-01 / Fedora arm64 / t4g.small</tspan><tspan x="44" y="578.4" /><tspan x="44" y="600.8">Salt master + minion + self-hosted runner</tspan><tspan x="44" y="623.2">Schedules all-minion highstate every 5 min</tspan><tspan x="44" y="645.6">Packages + TuneD aws profile on both hosts</tspan><tspan x="44" y="668.0">Receives k3s token via cp.push</tspan><tspan x="44" y="690.4">K3S_TOKEN pillar: all authenticated minions</tspan></text><rect x="584" y="484" width="432" height="270" fill="#f5f3ff" stroke="#f5f3ff" stroke-width="1.5" rx="16" /><text fill="#7c3aed" font-family="Arial, Helvetica, sans-serif" font-size="23"><tspan x="604" y="523.0">k3s.ergoshear.dev</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16"><tspan x="604" y="556.0">k3s-control-plane-01 / arm64 / t4g.medium</tspan><tspan x="604" y="578.4" /><tspan x="604" y="600.8">Salt installs k3s + CLI tools</tspan><tspan x="604" y="623.2">Control-plane: NoSchedule taint</tspan><tspan x="604" y="645.6">Platform pods have explicit tolerations</tspan><tspan x="604" y="668.0">Argo CD + Traefik + k3s ServiceLB</tspan><tspan x="604" y="690.4">ExternalDNS + cert-manager</tspan></text><polyline points="456,580 584,580" fill="none" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-highstate)" /><text fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="14"><tspan x="476" y="562.0">highstate</tspan></text><polyline points="584,658 456,658" fill="none" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-token)" stroke-dasharray="8 6" /><text fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="14"><tspan x="477" y="640.0">cp.push</tspan></text><polyline points="800,754 800,804" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-tls-api)" stroke-dasharray="8 6" /><text fill="#b45309" font-family="Arial, Helvetica, sans-serif" font-size="14"><tspan x="300" y="773.0">Route 53 API / instance IAM role</tspan></text><rect x="24" y="804" width="484" height="160" fill="#fffbeb" stroke="#fffbeb" stroke-width="1.5" rx="16" /><text fill="#b45309" font-family="Arial, Helvetica, sans-serif" font-size="23"><tspan x="44" y="843.0">DNS / Route 53</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16"><tspan x="44" y="876.0">Terraform: host A records point to persistent EIPs</tspan><tspan x="44" y="898.4">ExternalDNS: argocd CNAME points to k3s hostname</tspan><tspan x="44" y="920.8">TXT registry + sync / scoped to ergoshear.dev</tspan></text><rect x="532" y="804" width="484" height="160" fill="#f0f9ff" stroke="#f0f9ff" stroke-width="1.5" rx="16" /><text fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="23"><tspan x="552" y="843.0">TLS / Let's Encrypt</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16"><tspan x="552" y="876.0">cert-manager: Route 53 DNS-01 validation</tspan><tspan x="552" y="898.4">Traefik terminates HTTPS on port 443</tspan><tspan x="552" y="920.8">Argo CD receives HTTP inside the cluster</tspan></text><polyline points="800,782 266,782 266,804" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-dns-link)" stroke-dasharray="8 6" /><text fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="14"><tspan x="24" y="1006.0">THE REQUEST PATH</tspan></text><text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="22"><tspan x="24" y="1041.0">https://argocd.ergoshear.dev</tspan></text><text fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="20"><tspan x="24" y="1080.0">DNS -&gt; k3s Elastic IP :443 -&gt; ServiceLB -&gt; Traefik -&gt; Argo CD</tspan></text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="15"><tspan x="24" y="1119.0">GitHub Actions deploy Argo CD Argo CD config: auto-sync, prune, self-heal</tspan></text></svg>
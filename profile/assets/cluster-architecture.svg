<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -5 3690 1675" width="3690" height="1675" role="img" aria-labelledby="title description"><title id="title">ergoshear infrastructure and deployment architecture</title><desc id="description">Three repositories manage AWS infrastructure, Salt configuration, and k3s. Route 53, ExternalDNS, cert-manager, and Traefik provide HTTPS to Argo CD.</desc><rect x="0" y="-5" width="3690" height="1675" fill="#ffffff" /><defs><marker id="arrow-aws-deploy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#1d4ed8" /></marker><marker id="arrow-salt-deploy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#047857" /></marker><marker id="arrow-k3s-deploy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#7c3aed" /></marker><marker id="arrow-salt-highstate" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#047857" /></marker><marker id="arrow-token-upload" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#047857" /></marker><marker id="arrow-dns-automation" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#b45309" /></marker></defs><text fill="#1e293b" font-family="Arial, Helvetica, sans-serif" font-size="32"><tspan x="40" y="47.0">ergoshear | Repository responsibilities and deployed architecture</tspan></text><text fill="#1e293b" font-family="Arial, Helvetica, sans-serif" font-size="20"><tspan x="40" y="82.0">Current configuration: aws + salt + k3s | 18 October 2026</tspan></text><rect x="20" y="410" width="2400" height="1240" fill="#f8fafc" stroke="#64748b" stroke-width="2" /><text fill="#1e293b" font-family="Arial, Helvetica, sans-serif" font-size="20"><tspan x="45" y="436.0">AWS account | us-east-2</tspan></text><rect x="40" y="110" width="700" height="230" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" /><text fill="#1e293b" font-family="Arial, Helvetica, sans-serif" font-size="22"><tspan x="62" y="152.0">github.com/ergoshear/aws</tspan><tspan x="62" y="179.5">Terraform / Terragrunt</tspan><tspan x="62" y="207.0">PR to main: plan | push to main: apply</tspan><tspan x="62" y="234.5">GitHub-hosted runner + AWS OIDC</tspan><tspan x="62" y="262.0">S3 remote state + native state locking</tspan></text><polyline points="390,340 390,465" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-aws-deploy)" /><rect x="860" y="110" width="700" height="230" fill="#ecfdf5" stroke="#047857" stroke-width="2" /><text fill="#1e293b" font-family="Arial, Helvetica, sans-serif" font-size="22"><tspan x="882" y="152.0">github.com/ergoshear/salt</tspan><tspan x="882" y="179.5">Push to main / manual dispatch</tspan><tspan x="882" y="207.0">Runner: salt-master-01</tspan><tspan x="882" y="234.5">Local highstate test=True, then apply</tspan><tspan x="882" y="262.0">Runner checkout is master's state/pillar source</tspan></text><polyline points="1210,340 1210,465" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#arrow-salt-deploy)" /><rect x="1680" y="110" width="700" height="230" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" /><text fill="#1e293b" font-family="Arial, Helvetica, sans-serif" font-size="22"><tspan x="1702" y="152.0">github.com/ergoshear/k3s</tspan><tspan x="1702" y="179.5">Push to main: server-side kubectl apply</tspan><tspan x="1702" y="207.0">Runner: k3s-control-plane-01</tspan><tspan x="1702" y="234.5">Kustomize: argocd/ (CRDs + cert-manager first)</tspan><tspan x="1702" y="262.0">Kubeconfig: /etc/rancher/k3s/k3s.yaml</tspan></text><polyline points="2030,340 2030,465" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-k3s-deploy)" /><rect x="40" y="465" width="700" height="330" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" /><text fill="#1e293b" font-family="Arial, Helvetica, sans-serif" font-size="22"><tspan x="62" y="509.0">AWS infrastructure (Terraform)</tspan><tspan x="62" y="536.5" /><tspan x="62" y="564.0">VPC + internet gateway</tspan><tspan x="62" y="591.5">Public subnet: both EC2 instances</tspan><tspan x="62" y="619.0">Private subnet: provisioned</tspan><tspan x="62" y="646.5">Separate persistent Elastic IP per hostname</tspan><tspan x="62" y="674.0">Security groups + SSM instance profiles</tspan><tspan x="62" y="701.5">Dedicated k3s IAM role: Route 53 zone access</tspan><tspan x="62" y="729.0">IMDSv2: pods can use the k3s instance role</tspan></text><rect x="860" y="465" width="700" height="490" fill="#ecfdf5" stroke="#047857" stroke-width="2" /><text fill="#1e293b" font-family="Arial, Helvetica, sans-serif" font-size="22"><tspan x="882" y="509.0">salt.ergoshear.dev | persistent Elastic IP</tspan><tspan x="882" y="536.5">Fedora 44 arm64 | t4g.small</tspan><tspan x="882" y="564.0" /><tspan x="882" y="591.5">Salt minion ID / runner: salt-master-01</tspan><tspan x="882" y="619.0">salt-master + salt-minion + SSM agent</tspan><tspan x="882" y="646.5">Master serves runner checkout: salt/ + pillar/</tspan><tspan x="882" y="674.0">Master scheduler: all-minion highstate / 5 min</tspan><tspan x="882" y="701.5">Common states: packages + TuneD aws profile</tspan><tspan x="882" y="729.0" /><tspan x="882" y="756.5">Receives k3s token via cp.push (file_recv)</tspan><tspan x="882" y="784.0">External pillar reads master cache token</tspan><tspan x="882" y="811.5">K3S_TOKEN available to all authenticated minions</tspan></text><rect x="1680" y="465" width="700" height="740" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" /><text fill="#1e293b" font-family="Arial, Helvetica, sans-serif" font-size="22"><tspan x="1702" y="509.0">k3s.ergoshear.dev | persistent Elastic IP</tspan><tspan x="1702" y="536.5">Fedora 44 arm64 | t4g.medium</tspan><tspan x="1702" y="564.0" /><tspan x="1702" y="591.5">Salt minion ID / runner: k3s-control-plane-01</tspan><tspan x="1702" y="619.0">k3s server + salt-minion + SSM agent</tspan><tspan x="1702" y="646.5">Salt installs k3s, kubectl, Helm, Kustomize</tspan><tspan x="1702" y="674.0">Control-plane taint: NoSchedule</tspan><tspan x="1702" y="701.5">Approved platform pods tolerate the taint</tspan><tspan x="1702" y="729.0" /><tspan x="1702" y="756.5">Argo CD namespace: argocd</tspan><tspan x="1702" y="784.0">Kustomize deploys Argo CD via GitHub Actions</tspan><tspan x="1702" y="811.5">No apps/ auto-sync or deploy key configured</tspan><tspan x="1702" y="839.0" /><tspan x="1702" y="866.5">Ingress: Traefik + k3s ServiceLB (80/443)</tspan><tspan x="1702" y="894.0">ExternalDNS v0.23: TXT ownership + sync</tspan><tspan x="1702" y="921.5">cert-manager v1.21.2: Route 53 DNS-01</tspan><tspan x="1702" y="949.0">Let's Encrypt ClusterIssuer + TLS certificate</tspan><tspan x="1702" y="976.5">Traefik terminates TLS; Argo CD uses HTTP</tspan><tspan x="1702" y="1004.0">Kubernetes API 6443: home CIDR only</tspan></text><polyline points="1560,610 1680,610" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#arrow-salt-highstate)" /><text fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="17"><tspan x="1568" y="572.0">Salt</tspan><tspan x="1568" y="593.25">states</tspan></text><polyline points="1680,830 1560,830" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#arrow-token-upload)" stroke-dasharray="8 6" /><text fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="17"><tspan x="1570" y="789.0">cp.push</tspan><tspan x="1570" y="810.25">token</tspan></text><rect x="40" y="875" width="700" height="285" fill="#fffbeb" stroke="#b45309" stroke-width="2" /><text fill="#1e293b" font-family="Arial, Helvetica, sans-serif" font-size="22"><tspan x="62" y="919.0">Route 53 | existing ergoshear.dev public zone</tspan><tspan x="62" y="946.5" /><tspan x="62" y="974.0">Terraform: salt.ergoshear.dev A -&gt; Salt EIP</tspan><tspan x="62" y="1001.5">Terraform: k3s.ergoshear.dev A -&gt; k3s EIP</tspan><tspan x="62" y="1029.0">ExternalDNS: argocd.ergoshear.dev CNAME</tspan><tspan x="62" y="1056.5">                         -&gt; k3s.ergoshear.dev</tspan><tspan x="62" y="1084.0">cert-manager: ACME DNS-01 TXT challenges</tspan><tspan x="62" y="1111.5">DNS changes scoped to this hosted zone</tspan></text><rect x="860" y="1040" width="700" height="165" fill="#ecfdf5" stroke="#047857" stroke-width="2" /><text fill="#1e293b" font-family="Arial, Helvetica, sans-serif" font-size="22"><tspan x="882" y="1084.0">Salt applies common configuration to both hosts</tspan><tspan x="882" y="1111.5">system.pkgs + system.tuned (aws -&gt; virtual-guest)</tspan><tspan x="882" y="1139.0">Master state only on salt-master-01</tspan><tspan x="882" y="1166.5">k3s.control-plane only on k3s-control-plane-01</tspan></text><polyline points="2030,1205 2030,1250 390,1250 390,1160" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-dns-automation)" stroke-dasharray="8 6" /><text fill="#b45309" font-family="Arial, Helvetica, sans-serif" font-size="20"><tspan x="795" y="1235.0">ExternalDNS + cert-manager -&gt; Route 53 API (instance role)</tspan></text><rect x="40" y="1340" width="2340" height="150" fill="#f0f9ff" stroke="#0369a1" stroke-width="2" /><text fill="#1e293b" font-family="Arial, Helvetica, sans-serif" font-size="23"><tspan x="62" y="1383.0">User HTTPS request</tspan><tspan x="62" y="1411.75">argocd.ergoshear.dev -&gt; CNAME k3s.ergoshear.dev -&gt; Elastic IP :443 -&gt; ServiceLB -&gt; Traefik -&gt; argocd-server</tspan><tspan x="62" y="1440.5">TLS: publicly trusted Let's Encrypt certificate; automatic DNS-01 renewal (not ACM; no AWS ALB/controller)</tspan></text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="20"><tspan x="62" y="1540.0">Deployment is driven by GitHub Actions, not an Argo CD apps auto-sync loop.</tspan><tspan x="62" y="1565.0">Last live check: Argo CD + certificate healthy, public HTTPS 200. Legacy Argo CD resources in default remain (not repo-managed).</tspan></text></svg>